<div fxLayout="row wrap">    
    <div fxFlex.gt-lg="100" fxFlex.gt-md="100" fxFlex.gt-xs="100" fxFlex="100">
        <mat-card>
            <mat-card-content>
                <div class="d-flex flex-wrap">
                    <div>
                        <mat-card-title>Total cases</mat-card-title>
                         <mat-card-subtitle>Italy</mat-card-subtitle>
                     </div>
                    <!-- <div class="ml-auto">
                        <ul class="list-inline">
                            <li>
                                <h6 class="text-success m-0"><i class="mdi mdi-checkbox-blank-circle font-10 m-r-10 "></i>Ample</h6> </li>
                            <li>
                                <h6 class=" text-info m-0"><i class="mdi mdi-checkbox-blank-circle font-10 m-r-10"></i>Pixel</h6> </li>
                        </ul>
                    </div> -->
                </div>

                <div class="ct-chart" >
                    <x-chartist class="" [data]="totalCases.data" [type]="totalCases.type" [options]="totalCases.options" [responsiveOptions]="totalCases.responsiveOptions"
                        [events]="totalCases.events"> </x-chartist>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
