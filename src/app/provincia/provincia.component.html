<div fxLayout="row wrap">
    <div fxFlex.gt-lg="100" fxFlex.gt-md="100" fxFlex.gt-xs="100" fxFlex="100">
        <mat-form-field class="form-field m-l-20">
            <mat-label>District</mat-label>
            <input matInput type="text" [(ngModel)]="districtNameInput" placeholder="es. Milano/Torino" (keyup.enter)="createTotalCases()">
            <button *ngIf="districtNameInput" mat-button matSuffix mat-icon-button aria-label="Search"
                (click)="createTotalCases()">
                <mat-icon>check</mat-icon>
            </button>
        </mat-form-field>
    </div>
</div>

<div fxLayout="row wrap">
    <div fxFlex.gt-lg="100" fxFlex.gt-md="100" fxFlex.gt-xs="100" fxFlex="100">
        <mat-card>
            <mat-card-content>
                <div class="d-flex flex-wrap">
                    <div>
                        <mat-card-title>Daily cases</mat-card-title>
                        <mat-card-subtitle>{{districtName}}</mat-card-subtitle>
                    </div>
                    <div class="ml-auto">
                        <ul class="list-inline">
                            <li>
                                <h6 class="text-info m-0"><i
                                        class="mdi mdi-checkbox-blank-circle font-10 m-r-10 "></i>Daily cases</h6>
                            </li>
                        </ul>
                    </div>
                </div>

                <div *ngIf="totalCases && totalCases.data.series.length > 0" class="ct-chart">
                    <x-chartist class="" [data]="totalCases.data" [type]="totalCases.type"
                        [options]="totalCases.options" [responsiveOptions]="totalCases.responsiveOptions"
                        [events]="totalCases.events"> </x-chartist>
                </div>
            </mat-card-content>
        </mat-card>
        <span *ngIf="!totalCasesIncrease">
            <div class="spinner">
                <div class="double-bounce1"></div>
                <div class="double-bounce2"></div>
            </div>
        </span>
    </div>
</div>
<div fxLayout="row wrap">
    <div fxFlex.gt-lg="100" fxFlex.gt-md="100" fxFlex.gt-xs="100" fxFlex="100">

        <mat-card>
            <mat-card-content>
                <div class="d-flex flex-wrap">
                    <div>
                        <mat-card-title>Daily increase</mat-card-title>
                        <mat-card-subtitle>{{districtName}}</mat-card-subtitle>
                    </div>
                    <div class="ml-auto">
                        <ul class="list-inline">
                            <li>
                                <h6 class=" text-info m-0"><i
                                        class="mdi mdi-checkbox-blank-circle font-10 m-r-10"></i>Daily increase</h6>
                            </li>
                        </ul>
                    </div>
                </div>

                <div *ngIf="totalCasesIncrease && totalCasesIncrease.data.series.length > 0" class="ct-chart">
                    <x-chartist class="" [data]="totalCasesIncrease.data" [type]="totalCasesIncrease.type"
                        [options]="totalCasesIncrease.options"
                        [responsiveOptions]="totalCasesIncrease.responsiveOptions" [events]="totalCasesIncrease.events">
                    </x-chartist>
                </div>
            </mat-card-content>
        </mat-card>
        <span *ngIf="!totalCasesIncrease">
            <div class="spinner">
                <div class="double-bounce1"></div>
                <div class="double-bounce2"></div>
            </div>
        </span>
    </div>
</div>
